name: todoist
description: "A simple todo app showcasing a simple Flutter app architecture."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  cloud_firestore: ^6.10.0
  cupertino_icons: ^2.0.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
